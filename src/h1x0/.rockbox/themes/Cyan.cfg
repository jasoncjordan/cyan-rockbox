# Theme Name: Cyan//
# Version: 0.1.0 — H1x0 release candidate
# Target: iRiver H120/H140, 160x128x2
# License: CC-BY-SA-3.0

font: /.rockbox/fonts/14-Terminus.fnt
sbs: /.rockbox/wps/Cyan.sbs
wps: /.rockbox/wps/Cyan.wps
fms: /.rockbox/wps/Cyan.fms
rfms: /.rockbox/wps/Cyan.rfms
remote font: /.rockbox/fonts/10-ProFont.fnt
rwps: /.rockbox/wps/Cyan.rwps
rsbs: /.rockbox/wps/Cyan.rsbs

# The custom SBS draws the prompt and inverse row together. This remains the
# high-contrast fallback if Rockbox falls back to its native list renderer.
selector type: bar (inverse)

statusbar: off
remote statusbar: off
scrollbar: off
# Cyan keeps the oversized >> cursor and adds a generated 13-pixel semantic
# icon column wherever Rockbox supplies a reliable list callback.
show icons: on
iconset: /.rockbox/icons/Cyan-13.bmp
viewers iconset: -
backdrop: -

# Queue A requires Rockbox's current-track callback. Cyan renders its value as
# an explicit NOW> label rather than exposing the small stock music-note icon.
playlist viewer icons: on

battery display: numeric
volume display: numeric
